# Render Blueprint: infrastructure as code for the production environment.
# Deploys are triggered by GitHub Actions only after CI passes (autoDeployTrigger: off).
services:
  - type: web
    name: ongem
    runtime: docker
    dockerfilePath: ./Dockerfile
    # Free while building: sleeps after ~15 min idle (cold start 30-60s), no preDeployCommand.
    # Upgrade to 0.5c-512mb before submission.
    plan: free
    region: frankfurt # closest Render region to the UAE
    autoDeployTrigger: "off"
    # Render gates zero-downtime deploys on this: a new instance that can't reach the
    # database never receives traffic, so a bad DATABASE_URL can't take the site down.
    healthCheckPath: /readyz
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: DATABASE_URL
        fromDatabase:
          name: ongem-db
          property: connectionString

databases:
  - name: ongem-db
    # Free while building: expires after 30 days, no backups. Upgrade to 0.1c-256mb before submission.
    plan: free
    region: frankfurt
    postgresMajorVersion: "16"
    ipAllowList: [] # only reachable from Render services on the private network

# Local development database. Not used in production (Render manages Postgres).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ongem
      POSTGRES_PASSWORD: ongem
      POSTGRES_DB: ongem
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ongem"]
      interval: 2s
      timeout: 3s
      retries: 15
volumes:
  pgdata:

name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# A newer push to the same branch cancels the in-flight run (never cancel main: it deploys).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  OPENSPEC_TELEMETRY: "0"

jobs:
  quality:
    name: Lint, typecheck, spec validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm spec:validate

  test:
    name: Tests (real Postgres via Testcontainers)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  security:
    name: Dependency audit and secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # gitleaks scans full history
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      # Fail on high/critical vulnerabilities in what we ship.
      - run: pnpm audit --prod --audit-level high
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: Build production image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: ongem-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Render
    # Only after every check passes, and only for pushes to main.
    needs: [quality, test, security, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ vars.PUBLIC_URL }}
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Trigger Render deploy of this exact commit
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          test -n "$DEPLOY_HOOK" || { echo "RENDER_DEPLOY_HOOK_URL secret is not set"; exit 1; }
          curl -fsS -X POST "${DEPLOY_HOOK}&ref=${GITHUB_SHA}" -o /dev/null
      - name: Wait until the new version is live and ready
        env:
          PUBLIC_URL: ${{ vars.PUBLIC_URL }}
        run: |
          expected="${GITHUB_SHA:0:7}"
          for i in $(seq 1 90); do
            body=$(curl -fsS "$PUBLIC_URL/readyz" || true)
            echo "attempt $i: $body"
            if echo "$body" | grep -q "\"version\":\"$expected\"" && echo "$body" | grep -q '"status":"ready"'; then
              echo "Version $expected is live and ready."
              exit 0
            fi
            sleep 10
          done
          echo "Timed out waiting for version $expected to become ready"
          exit 1
